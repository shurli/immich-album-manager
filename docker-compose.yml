services:
  immich-album-manager:
    build: .
    container_name: immich-album-manager
    restart: unless-stopped
    ports:
      - "3473:3473"
    environment:
      IMMICH_URL: ${IMMICH_URL:-http://host.docker.internal:2283}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      MERGE_PAGE_SIZE: ${MERGE_PAGE_SIZE:-1000}
      MERGE_CHUNK_SIZE: ${MERGE_CHUNK_SIZE:-1000}
      MERGE_SOURCE_CONCURRENCY: ${MERGE_SOURCE_CONCURRENCY:-3}
      EXTREMA_CONCURRENCY: ${EXTREMA_CONCURRENCY:-6}
      EXTREMA_CACHE_TTL_MS: ${EXTREMA_CACHE_TTL_MS:-120000}
      ARCHIVE_STATUS_CONCURRENCY: ${ARCHIVE_STATUS_CONCURRENCY:-4}
      ARCHIVE_STATUS_CACHE_TTL_MS: ${ARCHIVE_STATUS_CACHE_TTL_MS:-120000}
      ARCHIVE_CHUNK_SIZE: ${ARCHIVE_CHUNK_SIZE:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
